version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: himalayan-churpi-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-himalayan_churpi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    container_name: himalayan-churpi-backend
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    image: node:22-alpine
    container_name: himalayan-churpi-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres-data:
